gnc:
  # =========================================================
  # ロボット基本パラメータ
  # =========================================================
  robot_radius: 0.10          # ロボット半径 [m]（衝突判定マージンの基準値）

  # =========================================================
  # 障害物回避クリアランス
  # =========================================================
  # 静的障害物（OctoMap）に対する離隔距離 [m]
  # CollisionChecker の safety_margin = static_clearance - robot_radius
  static_clearance: 0.05

  # 静的クリアランスを緩和するリトライの下限 [m]（= robot_radius + 0.15）
  # これ以下にはしない
  min_clearance: 0.05

  # 動的障害物（PointCloud）に対する膨張量 [m]
  # CollisionChecker の dynamic_safety_margin に対応
  # この値がそのまま膨張量になる（robot_radius は加算しない）
  # 0.0 → 膨張なし、0.05 → 0.05m 膨張
  dynamic_clearance: 0.05

  # =========================================================
  # 再計画制御
  # =========================================================
  # 物理的な前進なしで連続再計画できる上限回数
  # 超過した場合はナビゲーション失敗とする
  max_replan_retries: 3

  # 回転のみリプラン時の動的レイヤークリア方式
  # "fov": FOVコーン内の旧ボクセルのみクリア（デフォルト）
  # "legacy": クリアなし（従来動作）
  dynamic_clear_mode: "fov"

  # 動的クリアランス再検証の有効化
  # true のとき、plan_with_retry 成功後に動的 EDT 最小距離を検査する
  dynamic_clearance_recheck_enabled: false

  # 再検証で要求する動的障害物からの最小距離 [m]
  dynamic_clearance_min_distance: 0.30

  # 再検証不合格時の再計画試行上限
  # 上限到達時は最後のパスを採用して継続する
  dynamic_clearance_recheck_max_retries: 3

  # =========================================================
  # スキャン・仮想ウェイポイント
  # =========================================================
  # 仮想WP（スキャン専用停止点）の挿入間隔 [m]
  # パスセグメントがこの距離を超える場合に中間点を自動挿入する
  scan_interval: 1.6

  # スキャン時の有効FOV半角：Mainカメラのとき最大 [80.0]
  # ステレオカメラ光軸からこの角度以内の点群のみを動的レイヤーに反映する
  scan_fov_deg: 40.0

  # 点群取得タイムアウト [s]
  scan_timeout: 5.0

  # 有効とみなす最低点群数（これ未満はノイズとして棄却）
  scan_min_points: 100

  # 点群サンプリングステップ（1点おきに N 点スキップ）
  scan_sampling_step: 5

  # =========================================================
  # A* プランナー
  # =========================================================
  # グリッド解像度 [m]（細かいほど精度は上がるが計算コスト増）
  grid_resolution: 0.15

  # CollisionChecker バウンディングボックスの余白 [m]
  bbox_pad: 2.2

  # 方向別 bbox 追加余白 [m]
  # min_* は負方向、max_* は正方向への追加拡張
  bbox_extra_min_x: 0.8
  bbox_extra_max_x: 0.0
  bbox_extra_min_y: 0.8
  bbox_extra_max_y: 0.8
  bbox_extra_min_z: 0.8
  bbox_extra_max_z: 0.8

  # A* 最大探索ノード数（無限ループ防止）
  astar_max_iter: 12000

  # =========================================================
  # パス後処理（Smoother）
  # =========================================================
  # フィルタチェーン（名前と順序）
  # 利用可能: push_from_walls, shortcut
  # 通常A*従来互換: ["push_from_walls", "shortcut"]
  # ポテンシャルA*互換: ["shortcut"]（壁際コストで広い経路を選ぶため、push_from_walls は不要）
  path_filters: ["shortcut"]

  # shortcut の EDT マージン閾値 [m]（0.0 でマージン判定無効、ギリギリの経路を出力）
  shortcut_margin: 0.30

  # push_from_walls の1ステップ押し出し量 [m]
  push_step: 0.10

  # push_from_walls の最大反復回数
  push_max_iter: 10

  # =========================================================
  # SafetyAwareAStarPlanner（ポテンシャル場 A*）
  # =========================================================
  # ポテンシャル場 A* を有効化（false: 通常の最短経路 A*）
  use_potential_astar: true

  # 壁際コスト重み（大きいほど広い経路を優先、通常A*使用時は無効）
  safety_weight: 1.5

  # 壁際コストを発動する距離閾値 [m]
  safety_threshold: 0.15

  # デュアル EDT（静的・動的分離コスト計算）
  # true: 静的 EDT と動的 EDT を分離し、個別の重みでペナルティを計算する
  # false: 既存の単一 EDT ロジック（safety_weight で統一）を使用
  use_dual_edt: true

  # 動的障害物（人）へのペナルティ発動距離しきい値 [m]（use_dual_edt=true 時のみ有効）
  # safety_threshold は静的障害物（壁）用、dynamic_threshold は動的障害物用
  dynamic_threshold: 0.40

  # 静的障害物（壁）へのコスト重み（use_dual_edt=true 時のみ有効）
  static_weight: 0.15

  # 動的障害物（人）へのコスト重み（use_dual_edt=true 時のみ有効）
  # static_weight より大きく設定すると壁沿いの経路を優先する
  dynamic_weight: 20.0

  # 壁面近傍の点群を動的レイヤーから除外するしきい値 [m]（use_dual_edt=true 時のみ有効）
  # 静的 EDT でこの距離未満の点をスキップする。0 でフィルタ無効。
  wall_filter_dist: 0.20

  # =========================================================
  # 実行モード・トピック設定
  # =========================================================
  # Executor の選択: steady（デフォルト）/ smooth / streaming
  executor_mode: "steady"

  # 動的障害物点群のトピック名
  obstacle_topic: "/depth/points"

  # =========================================================
  # ナビゲーションモード
  # =========================================================
  # "full"  : 通常モード（点群取得・経路計画・事前回転・仮想WP挿入すべて有効）
  # "direct": 直接TF追従モード（障害物なし前提・ドックエリア向け）
  # "direct_rotate": 直接TF追従 + 終端姿勢合わせ（move_to 1回）
  #           PathPlanner/ObstacleManager/回転/仮想WPを全バイパスし
  #           PoseResolver.resolve() → Executor.move_to() のみ実行
  navigation_mode: "full"

  # =========================================================
  # direct_rotate 姿勢検証許容誤差
  # =========================================================
  # 到着後の Yaw 許容誤差 [deg]（超過時は再調整 move_to を発行）
  direct_rotate_yaw_tol_deg: 10.0

  # 到着後の Pitch 許容誤差 [deg]
  direct_rotate_pitch_tol_deg: 10.0

  # =========================================================
  # タイミング制御
  # =========================================================
  # WP 追従の上限タイムアウト [s]（収束不能時にスキップして次の WP へ進む）
  wp_move_timeout: 45.0

  # 回転後の揺れ収束待ち時間 [s]（スキャン前のセトリング）
  stabilize_wait: 2.0

  # 初回スキャン前の待機時間 [s]（pre-rotate 後）
  initial_scan_wait: 0.5

  # 最終姿勢調整のサンプリング間隔 [s]
  final_adjust_sample_interval: 0.1
